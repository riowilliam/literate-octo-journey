<div class="flex flex-col">
  <label *ngIf="label" [ngClass]="labelClass">{{ label }}</label>
  <ng-container [ngSwitch]="type">
    <input
      *ngSwitchCase="'text'"
      type="text"
      [value]="value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="handleInput($event)"
      [ngClass]="inputClass"
      autocomplete="off"
    />

    <input
      *ngSwitchCase="'number'"
      type="text"
      [value]="value | rupiahMask"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="handleInput($event)"
      [ngClass]="inputClass"
    />

    <div class="relative inline-block w-full" *ngSwitchCase="'dropdown'">
      <select
        class="pr-8 appearance-none"
        [value]="value"
        [disabled]="disabled"
        (change)="handleSelect($event)"
        [ngClass]="inputClass"
      >
        <option value="" disabled hidden>{{ placeholder }}</option>
        <option *ngFor="let option of options" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
      <div
        class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-700"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          ></path>
        </svg>
      </div>
    </div>

    <textarea
      *ngSwitchCase="'textarea'"
      [value]="value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="handleInput($event)"
      [ngClass]="inputClass"
    ></textarea>

    <input
      *ngSwitchCase="'datepicker'"
      type="date"
      [value]="value"
      [disabled]="disabled"
      (change)="handleDateChange($event)"
      [ngClass]="inputClass"
    />

    <div class="relative w-full" *ngSwitchCase="'searchable-dropdown'">
      <input
        type="text"
        [value]="value"
        placeholder="{{ placeholder }}"
        (input)="filterOptions($event)"
        (focus)="showDropdown = true"
        (blur)="hideDropdown()"
        [ngClass]="inputClass"
        autocomplete="off"
      />
      <div
        *ngIf="showDropdown"
        class="absolute z-10 w-full bg-white border border-gray-300 rounded-md max-h-60 overflow-auto mt-2"
      >
        <ul>
          <li
            *ngFor="let option of filteredOptions"
            (click)="selectOption(option.label)"
            class="px-4 py-2 cursor-pointer hover:bg-gray-100"
          >
            {{ option.label }}
          </li>
        </ul>
      </div>
      <div
        class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-700"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          ></path>
        </svg>
      </div>
    </div>
  </ng-container>
</div>
