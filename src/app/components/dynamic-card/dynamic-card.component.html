<div
  [ngClass]="cardClass"
  class="flex flex-col gap-2 rounded-[15px] border border-custom-very-light-yellow overflow-clip"
>
  <div
    [ngClass]="headerClass"
    class="flex items-center justify-center bg-gray-200 p-2"
  >
    <span [ngClass]="headerTextClass" class="text-xl font-semibold">{{
      headerText
    }}</span>
  </div>
  <div
    *ngFor="let section of sections"
    class="flex gap-4 p-2 flex-col sm:flex-row w-full justify-center h-full"
  >
    <div
      *ngFor="let item of section"
      class="flex flex-col items-center justify-center"
    >
      <span class="text-sm font-medium">{{ item.label }}</span>
      <ng-container *ngIf="item.type === 'currency'">
        <span class="text-xl font-semibold text-center">{{
          item.value | rupiahPipe
        }}</span>
      </ng-container>
      <ng-container *ngIf="!item.type">
        <span class="text-xl font-semibold text-center">{{ item.value }}</span>
      </ng-container>
    </div>
  </div>
</div>
