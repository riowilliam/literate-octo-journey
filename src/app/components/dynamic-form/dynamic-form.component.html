<form [formGroup]="formGroup">
  <div formArrayName="rows" class="contents overflow-x-auto">
    <div
      *ngFor="let row of rows.controls; let i = index"
      [formGroupName]="i"
      class="flex flex-col"
    >
      <div class="w-max flex">
        <ng-container *ngIf="i === 0">
          <div class="flex flex-col">
            <label
              for="no-{{ i }}"
              class="font-medium bg-gray-100 text-center mb-2"
              >No</label
            >
            <input
              id="no-{{ i }}"
              name="no-{{ i }}"
              type="text"
              formControlName="no"
              class="form-input w-16 text-center mb-2 mt-2"
              readonly
            />
          </div>
        </ng-container>

        <ng-container *ngIf="i !== 0">
          <div class="flex flex-col">
            <input
              id="no-{{ i }}"
              name="no-{{ i }}"
              type="text"
              formControlName="no"
              class="form-input w-16 text-center mb-2 mt-2"
              readonly
            />
          </div>
        </ng-container>

        <ng-container *ngFor="let field of fields">
          <div class="flex flex-col">
            <ng-container *ngIf="i === 0">
              <label
                for="{{ field.name }}-{{ i }}"
                class="font-medium bg-gray-100 text-center mb-2"
              >
                {{ field.label }}
              </label>
            </ng-container>
            <ng-container [ngSwitch]="field.type">
              <div class="mx-2.5">
                <input
                  *ngSwitchCase="'text'"
                  id="{{ field.name }}-{{ i }}"
                  name="{{ field.name }}-{{ i }}"
                  type="text"
                  [formControlName]="field.name"
                  [placeholder]="field.placeholder"
                  class="form-input text-center mb-2 border border-black px-3 py-2 text-sm placeholder:text-black"
                  [ngClass]="
                    field.name === 'bankAccountName'
                      ? 'focus:outline-none ' + field.bgClass
                      : 'focus:outline-none focus:ring-2 focus:ring-custom-light-yellow ' +
                        field.bgClass
                  "
                  [readonly]="field.name === 'bankAccountName'"
                />
              </div>
              <div class="mx-2.5">
                <input
                  *ngSwitchCase="'number'"
                  id="{{ field.name }}-{{ i }}"
                  name="{{ field.name }}-{{ i }}"
                  type="number"
                  [formControlName]="field.name"
                  [placeholder]="field.placeholder"
                  class="form-input text-center mb-2 border border-black px-3 py-2 text-sm placeholder:text-black"
                  [ngClass]="
                    field.name === 'bankAccount'
                      ? 'focus:outline-none ' + field.bgClass
                      : 'focus:outline-none focus:ring-2 focus:ring-custom-light-yellow ' +
                        field.bgClass
                  "
                  [readonly]="field.name === 'bankAccount'"
                />
              </div>
              <div class="mx-2.5">
                <input
                  *ngSwitchCase="'currency'"
                  id="{{ field.name }}-{{ i }}"
                  name="{{ field.name }}-{{ i }}"
                  type="text"
                  [formControlName]="field.name"
                  [placeholder]="field.placeholder"
                  class="form-input text-center mb-2 border border-black px-3 py-2 text-sm placeholder:text-black focus:outline-none"
                  [ngClass]="field.bgClass"
                  [readonly]="field.name === 'transferAmount' ? true : false"
                  [ngClass]="
                    field.name === 'transferAmount'
                      ? 'cursor-not-allowed'
                      : field.bgClass
                      ? field.bgClass +
                        ' focus:ring-2 focus:ring-custom-light-yellow'
                      : 'focus:ring-2 focus:ring-custom-light-yellow'
                  "
                  (input)="onInputChange($event, field.name, i)"
                />
              </div>
              <div class="mx-2.5">
                <div
                  class="relative inline-block w-full"
                  *ngSwitchCase="'select'"
                >
                  <select
                    id="{{ field.name }}-{{ i }}"
                    name="{{ field.name }}-{{ i }}"
                    [formControlName]="field.name"
                    class="pr-8 appearance-none form-select text-center mb-2 border border-black px-3 py-2 text-sm placeholder:text-black focus:outline-none focus:ring-2 focus:ring-custom-light-yellow"
                    [ngClass]="field.bgClass"
                  >
                    <option value="" disabled selected hidden>
                      {{ field.placeholder }}
                    </option>
                    <option
                      *ngFor="let option of field.options"
                      [value]="option"
                    >
                      {{ option }}
                    </option>
                  </select>
                  <div
                    class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-700 mb-2"
                  >
                    <svg
                      width="16"
                      height="8"
                      viewBox="0 0 16 8"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M0.988143 0.507823L8.5 7.50022L15.9881 0.492631L0.988143 0.507823Z"
                        fill="black"
                        fill-opacity="0.5"
                      />
                    </svg>
                  </div>
                </div>
              </div>
              <div class="mx-2.5">
                <div
                  class="relative inline-block w-full"
                  *ngSwitchCase="'searchable-dropdown'"
                >
                  <input
                    type="text"
                    id="{{ field.name }}-{{ i }}"
                    name="{{ field.name }}"
                    [formControlName]="field.name"
                    placeholder="{{ field.placeholder }}"
                    (input)="filterOptions($event, field.name + '-' + i)"
                    (focus)="setInitialOptions(field.name + '-' + i)"
                    class="w-full pr-8 appearance-none form-input text-center border border-black px-3 py-2 text-sm placeholder:text-black"
                    autocomplete="off"
                    [ngClass]="
                      field.name === 'bankName'
                        ? 'focus:outline-none ' + field.bgClass
                        : 'focus:outline-none focus:ring-2 focus:ring-custom-light-yellow ' +
                          field.bgClass
                    "
                    [readonly]="field.name === 'bankName'"
                  />

                  <div
                    *ngIf="showDropdown[field.name + '-' + i]"
                    class="absolute left-0 w-full bg-white border border-gray-300 rounded-md max-h-80 overflow-auto mt-1 z-50"
                  >
                    <ul>
                      <li
                        *ngFor="
                          let option of filteredOptions[field.name + '-' + i]
                        "
                        (click)="selectOption(option, field.name, i)"
                        class="px-4 py-2 cursor-pointer hover:bg-gray-100"
                      >
                        {{ option.label }}
                      </li>
                    </ul>
                  </div>

                  <div
                    class="pointer-events-none absolute top-2.5 right-0 flex items-center pr-3 text-gray-700"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 9l-7 7-7-7"
                      ></path>
                    </svg>
                  </div>
                </div>
              </div>
            </ng-container>
          </div>
        </ng-container>

        <ng-container *ngIf="i === 0">
          <div class="flex flex-col items-center">
            <label
              class="w-full font-medium bg-gray-100 text-center text-transparent mb-2"
              >Action</label
            >
            <button
              type="button"
              (click)="removeRow(i)"
              [disabled]="rows.length === 1"
              class="h-full py-2 px-4 bg-custom-light-red text-xs hover:bg-custom-red focus:outline-none focus:ring-2 focus:ring-custom-light-red focus:ring-opacity-50 disabled:bg-gray-400 disabled:text-gray-600 mb-2"
            >
              Remove
            </button>
          </div>
        </ng-container>

        <ng-container *ngIf="i !== 0">
          <div class="flex flex-col items-center mb-2">
            <button
              type="button"
              (click)="removeRow(i)"
              [disabled]="rows.length === 1"
              class="h-full py-2 px-4 bg-custom-light-red text-xs hover:bg-custom-red focus:outline-none focus:ring-2 focus:ring-custom-light-red focus:ring-opacity-50"
            >
              Remove
            </button>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</form>

<div class="absolute left-0 right-0 mt-4 flex items-center justify-center">
  <button
    type="button"
    (click)="addRow()"
    class="py-2 px-4 bg-custom-light-yellow text-xs hover:bg-custom-yellow focus:outline-none focus:ring-2 focus:ring-custom-light-yellow focus:ring-opacity-50 disabled:bg-gray-400 disabled:text-gray-600"
  >
    Add new row
  </button>
</div>
