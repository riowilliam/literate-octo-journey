<div
  *ngIf="message"
  [ngClass]="getNotificationClass()"
  class="fixed top-0 right-0 m-4 p-4 rounded shadow-lg z-50"
>
  <div class="w-full flex items-center justify-between">
    <p>{{ message }}</p>
    <button (click)="clear()" class="ml-2">
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
      </svg>
    </button>
  </div>
</div>
