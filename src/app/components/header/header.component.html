      <!-- Desktop Menu -->
      <nav class="hidden md:inline-block">
        <ng-container *ngFor="let item of menuItems">
          <a
            *ngIf="hasAccess(item.requiredPermissions)"
            [routerLink]="item.link"
            [ngClass]="{
              'bg-custom-yellow': isActive(item),
              'rounded-b-none': item.subMenuOpen && item.subMenu
            }"
            class="relative inline-flex flex-wrap items-center justify-center content-center hover:bg-custom-light-yellow px-3 py-2 text-sm rounded-md font-semibold ml-2 min-w-[107px]"
            (click)="handleMenuItemClick(item)"
          >
            {{ item.name }}
            <div
              *ngIf="item.subMenu && item.subMenuOpen"
              class="absolute top-full left-0 bg-white shadow-lg z-10 rounded-b-md overflow-clip"
            >
              <ng-container *ngFor="let subItem of item.subMenu">
                <a
                  *ngIf="hasAccess(subItem.requiredPermissions)"
                  [routerLink]="subItem.link"
                  [ngClass]="{
                    'bg-custom-yellow': isActive(subItem),
                  }"
                  class="inline-block w-full px-4 py-2 hover:bg-custom-light-yellow text-center"
                >
                  {{ subItem.name }}
                </a>
              </ng-container>
            </div>
          </a>
        </ng-container>
      </nav>
    </div>

    <!-- User Info and Logout -->
    <div class="flex items-center space-x-4">
      <div
        class="flex items-center gap-2 cursor-pointer"
        (click)="navigateToAccountInformation()"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M10 0C7.25 0 5 2.8 5 6.25C5 9.7 7.25 12.5 10 12.5C12.75 12.5 15 9.7 15 6.25C15 2.8 12.75 0 10 0ZM4.775 12.5C2.125 12.625 0 14.8 0 17.5V20H20V17.5C20 14.8 17.9 12.625 15.225 12.5C13.875 14.025 12.025 15 10 15C7.975 15 6.125 14.025 4.775 12.5Z"
            fill="black"
          />
        </svg>
        <span class="block text-base font-semibold"> {{ fullName }}</span>
      </div>
      <button (click)="logout()">
        <svg
          width="23"
          height="20"
          viewBox="0 0 23 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M8.57143 0V2.85714H20V17.1429H8.57143V20H22.8571V0H8.57143ZM5.71429 5.71429L0 10L5.71429 14.2857V11.4286H17.1429V8.57143H5.71429V5.71429Z"
            fill="black"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div
    [ngClass]="{
      'translate-x-0 opacity-100': mobileMenuOpen,
      '-translate-x-full opacity-0': !mobileMenuOpen
    }"
    class="fixed inset-0 bg-gray-700 bg-opacity-75 backdrop-blur z-50 md:hidden transition-transform transition-opacity duration-300 ease-in-out"
  >
    <div class="flex flex-col h-full gap-4">
      <div class="flex justify-end">
        <button (click)="toggleMobileMenu()" class="p-4 text-white">
          <span class="sr-only">Close menu</span>
          &#x2715;
        </button>
      </div>
      <nav class="flex flex-col flex-grow pl-4 space-y-2 overflow-y-auto">
        <a
          *ngIf="hasAccess(['view_dashboard'])"
          href="/dashboard"
          class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
          >Dashboard</a
        >
        <a
          *ngIf="hasAccess(['view_project_monitoring'])"
          href="/project-monitoring"
          class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
          >Project Monitoring</a
        >
        <a
          *ngIf="hasAccess(['view_ar_monitoring'])"
          href="/ar-monitoring"
          class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
          >AR Monitoring</a
        >
        <a
          *ngIf="hasAccess(['view_cash_in'])"
          href="/cash-in"
          class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
          >Cash In</a
        >

        <!-- Cash Out Menu -->
        <div
          *ngIf="hasAccess(['view_cash_out_menu'])"
          (click)="toggleCashOutMenu($event)"
          class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
        >
          Cash Out
        </div>
        <div
          *ngIf="isCashOutOpen"
          [ngClass]="{
            'max-h-0 overflow-hidden': !isCashOutOpen,
            'max-h-screen': isCashOutOpen
          }"
          class="pl-4 space-y-2 transition-max-height duration-300 ease-in-out"
        >
          <a
            *ngIf="hasAccess(['manage_documents'])"
            href="/document-cash-out"
            class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
            >Document</a
          >
          <a
            *ngIf="hasAccess(['manage_regular_mutation'])"
            href="/regular-cash-out"
            class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
            >Mutation</a
          >
          <a
            *ngIf="hasAccess(['manage_facility'])"
            href="/facility-asset"
            class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
            >Facility</a
          >
        </div>

        <!-- Master Data Menu -->
        <div
          *ngIf="hasAccess(['view_master_data'])"
          (click)="toggleMasterDataMenu($event)"
          class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
        >
          Master Data
        </div>
        <div
          *ngIf="isMasterDataOpen"
          [ngClass]="{
            'max-h-0 overflow-hidden': !isMasterDataOpen,
            'max-h-screen': isMasterDataOpen
          }"
          class="pl-4 space-y-2 transition-max-height duration-300 ease-in-out"
        >
          <a
            *ngIf="hasAccess(['manage_partner'])"
            href="/partner"
            class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
            >Customer</a
          >
          <a
            *ngIf="hasAccess(['manage_vendor'])"
            href="/vendor"
            class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
            >Vendor</a
          >
          <a
            *ngIf="hasAccess(['manage_project'])"
            href="/project"
            class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
            >Project</a
          >
          <a
            *ngIf="hasAccess(['manage_contract'])"
            href="/contract"
            class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
            >Contract</a
          >
          <a
            *ngIf="hasAccess(['manage_items'])"
            href="/items"
            class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
            >Items</a
          >
          <a
            *ngIf="hasAccess(['manage_user'])"
            href="/user"
            class="block text-white hover:text-black hover:bg-custom-light-yellow py-2 px-2 rounded-l-md transition-colors duration-200 ease-in-out"
            >User</a
          >
        </div>
      </nav>
    </div>
  </div>
</header>
