<div
  *ngIf="showModal"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  (click)="onBackdropClick($event)"
>
  <div
    class="modal-content rounded-lg shadow-lg max-w-xl w-full flex flex-col items-center justify-center overflow-clip"
    (click)="$event.stopPropagation()"
  >
    <div
      class="bg-custom-light-gray w-full flex items-center justify-center p-2"
    >
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-semibold">{{ title }}</h3>
      </div>
    </div>
    <div class="bg-white w-full p-2">
      <ng-content></ng-content>
      <div class="flex justify-end mt-4">
        <button
          (click)="close()"
          class="bg-blue-500 text-white px-4 py-2 rounded"
        >
          Close
        </button>
      </div>
    </div>
  </div>
</div>
