<div
  class="fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-50 z-100"
  *ngIf="isOpen"
  (click)="close()"
>
  <div
    class="bg-white p-4 rounded-lg shadow-lg"
    (click)="$event.stopPropagation()"
  >
    <button class="absolute top-2 right-2" (click)="close()">X</button>
    <input
      type="date"
      class="w-full border border-gray-300 rounded-md p-2"
      (change)="onDateChange($event)"
    />
    <button
      class="mt-4 w-full h-auto text-base px-4 py-2 rounded-xl font-medium hover:bg-custom-light-yellow bg-custom-yellow cursor-pointer rounded-md p-2"
      (click)="confirmDate()"
    >
      Confirm
    </button>
  </div>
</div>
