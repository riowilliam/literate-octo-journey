<app-content-account [hasTrademark]="true">
  <app-dynamic-account [imageSrc]="true">
    <form [formGroup]="changeUsernameForm" (ngSubmit)="onSubmit()">
      <div class="mb-6 w-full sm:min-w-[400px] sm:max-w-[400px]">
        <label for="username" class="block font-semibold mb-2 text-left text-sm"
          >Username</label
        >
        <input
          id="username"
          formControlName="username"
          type="text"
          class="shadow-drop w-full px-4 py-2 text-sm bg-custom-thin-gray rounded-lg focus:outline-none focus:ring-2 focus:ring-custom-light-yellow h-[40px]"
        />
      </div>

      <div class="flex flex-col justify-center items-center gap-2">
        <button
          type="submit"
          class="w-full min-w-[180px] max-w-[180px] py-2 px-4 bg-custom-light-yellow text-xs font-semibold rounded-lg hover:bg-custom-yellow focus:outline-none focus:ring-2 focus:ring-custom-light-yellow focus:ring-opacity-50 disabled:bg-gray-400 disabled:text-gray-600"
          [disabled]="changeUsernameForm.invalid"
        >
          Change Username
        </button>

        <button
          type="submit"
          class="w-full min-w-[180px] max-w-[180px] py-2 px-4 bg-custom-light-red text-xs font-semibold rounded-lg hover:bg-custom-red focus:outline-none focus:ring-2 focus:ring-custom-light-red focus:ring-opacity-50 disabled:bg-gray-400 disabled:text-gray-600"
          (click)="navigateToAccountInformation()"
        >
          cancel
        </button>
      </div>
    </form>
  </app-dynamic-account>
</app-content-account>
