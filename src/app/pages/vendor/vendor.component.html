<app-dynamic-modal
  [title]="'Add new Vendor'"
  [showModal]="showModalAdd"
  (closeModal)="closeModalAdd()"
>
  <app-dynamic-form-on-pop-up
    [dynamicForm]="vendorForm"
    [formConfig]="formConfig"
    (formSubmit)="handleFormSubmit($event, 'add')"
    (formCancel)="handleFormCancel()"
  >
  </app-dynamic-form-on-pop-up>
</app-dynamic-modal>

<app-dynamic-modal
  [title]="'Edit Vendor'"
  [showModal]="showModalEdit"
  (closeModal)="closeModalEdit()"
>
  <app-dynamic-form-on-pop-up
    [formValue]="{
      formVendorName: vendorForm.get('formVendorName')?.value,
      formBankAccount: vendorForm.get('formBankAccount')?.value,
      formBankAccountName: vendorForm.get('formBankAccountName')?.value,
      formBankName: getBank(vendorForm.get('formBankName')?.value, 'label'),
      vendorId: vendorForm.get('vendorId')?.value,
      bankCode: vendorForm.get('bankCode')?.value
    }"
    [dynamicForm]="vendorForm"
    [formConfig]="formConfig"
    (formSubmit)="handleFormSubmit($event, 'edit')"
    (formCancel)="handleFormCancel()"
  >
  </app-dynamic-form-on-pop-up>
</app-dynamic-modal>

<app-content-filter
  [title]="'Filter'"
  (buttonClickApply)="handleButtonClick({ key: 'apply' })"
  (buttonClickClear)="handleButtonClick({ key: 'clear' })"
>
  <app-dynamic-input
    type="text"
    [value]="filterForm.get('vendorName')?.value"
    placeholder="Enter text"
    label="Vendor Name"
    formControlName="vendorName"
    [inputClass]="
      'px-3 py-2 border rounded rounded-lg border-black border-[0.37px] text-sm placeholder:text-black focus:outline-none focus:ring-2 focus:ring-custom-light-yellow'
    "
    [labelClass]="'font-medium text-sm mb-1'"
    (valueChange)="handleValueChange($event, 'vendorName')"
  ></app-dynamic-input>

  <app-dynamic-input
    type="searchable-dropdown"
    [value]="filterForm.get('bankName')?.value"
    placeholder="Select an option"
    [options]="dropdownOptions"
    label="Bank Name"
    formControlName="bankName"
    [inputClass]="
      'w-full px-3 py-2 border rounded rounded-lg border-black border-[0.37px] text-sm placeholder:text-black focus:outline-none focus:ring-2 focus:ring-custom-light-yellow'
    "
    [labelClass]="'font-medium text-sm mb-1'"
    (valueChange)="handleValueChange($event, 'bankName')"
  ></app-dynamic-input>

  <app-dynamic-input
    type="text"
    [value]="filterForm.get('bankAccount')?.value"
    placeholder="Enter text"
    label="Bank Account"
    formControlName="bankAccount"
    [inputClass]="
      'px-3 py-2 border rounded rounded-lg border-black border-[0.37px] text-sm placeholder:text-black focus:outline-none focus:ring-2 focus:ring-custom-light-yellow'
    "
    [labelClass]="'font-medium text-sm mb-1'"
    (valueChange)="handleValueChange($event, 'bankAccount')"
  ></app-dynamic-input>

  <app-dynamic-input
    type="text"
    [value]="filterForm.get('bankAccountName')?.value"
    placeholder="Enter text"
    label="Bank Account Name"
    formControlName="bankAccountName"
    [inputClass]="
      'px-3 py-2 border rounded rounded-lg border-black border-[0.37px] text-sm placeholder:text-black focus:outline-none focus:ring-2 focus:ring-custom-light-yellow'
    "
    [labelClass]="'font-medium text-sm mb-1'"
    (valueChange)="handleValueChange($event, 'bankAccountName')"
  ></app-dynamic-input>
</app-content-filter>

<app-content-table
  [title]="'Vendor List'"
  [label]="'Add New Vendor'"
  [hasButton]="true"
  (buttonClick)="handleButtonClick({ key: 'add' })"
>
  <app-dynamic-table
    [headers]="headers"
    [rows]="data"
    [totalPages]="totalPages"
    [pageSize]="pageSize"
    [currentPage]="pageNo + 1"
    (buttonPagination)="onPageChange($event)"
    (buttonClick)="handleButtonClick($event)"
  >
  </app-dynamic-table>
</app-content-table>
