<app-dynamic-modal
  [title]="'Add new User'"
  [showModal]="showModalAdd"
  (closeModal)="closeModalAdd()"
>
  <app-dynamic-form-on-pop-up
    [dynamicForm]="userForm"
    [formConfig]="formConfig"
    (formSubmit)="handleFormSubmit($event, 'add')"
    (formCancel)="handleFormCancel()"
  >
  </app-dynamic-form-on-pop-up>
</app-dynamic-modal>

<app-dynamic-modal
  [title]="'Edit User'"
  [showModal]="showModalEdit"
  (closeModal)="closeModalEdit()"
>
  <app-dynamic-form-on-pop-up
    [formValue]="{
      formUsername: userForm.get('formUsername')?.value,
      formFullName: userForm.get('formFullName')?.value,
      formEmail: userForm.get('formEmail')?.value,
      formContact: userForm.get('formContact')?.value,
      formRole: userForm.get('formRole')?.value
    }"
    [dynamicForm]="userForm"
    [formConfig]="formConfig"
    (formSubmit)="handleFormSubmit($event, 'edit')"
    (formCancel)="handleFormCancel()"
  >
  </app-dynamic-form-on-pop-up>
</app-dynamic-modal>

<app-content-filter
  [title]="'Filter'"
  (buttonClickApply)="handleButtonClick({ key: 'apply' })"
  (buttonClickClear)="handleButtonClick({ key: 'clear' })"
>
  <app-dynamic-input
    type="text"
    [value]="filterForm.get('fullName')?.value"
    placeholder="Enter text"
    label="Full Name"
    formControlName="fullName"
    [inputClass]="
      'px-3 py-2 border rounded rounded-lg border-black border-[0.37px] text-sm placeholder:text-black focus:outline-none focus:ring-2 focus:ring-custom-light-yellow'
    "
    [labelClass]="'font-medium text-sm mb-1'"
    (valueChange)="handleValueChange($event, 'fullName')"
  ></app-dynamic-input>

  <app-dynamic-input
    type="text"
    [value]="filterForm.get('email')?.value"
    placeholder="Enter text"
    label="Email"
    formControlName="email"
    [inputClass]="
      'px-3 py-2 border rounded rounded-lg border-black border-[0.37px] text-sm placeholder:text-black focus:outline-none focus:ring-2 focus:ring-custom-light-yellow'
    "
    [labelClass]="'font-medium text-sm mb-1'"
    (valueChange)="handleValueChange($event, 'email')"
  ></app-dynamic-input>

  <app-dynamic-input
    type="dropdown"
    [value]="filterForm.get('role')?.value"
    placeholder="Select an option"
    [options]="dropdownOptions"
    label="Role"
    formControlName="role"
    [inputClass]="
      'w-full px-3 py-2 border rounded rounded-lg border-black border-[0.37px] text-sm placeholder:text-black focus:outline-none focus:ring-2 focus:ring-custom-light-yellow'
    "
    [labelClass]="'font-medium text-sm mb-1'"
    (valueChange)="handleValueChange($event, 'role')"
  ></app-dynamic-input>

  <app-dynamic-input
    type="text"
    [value]="filterForm.get('contact')?.value"
    placeholder="Enter text"
    label="Contact"
    formControlName="contact"
    [inputClass]="
      'px-3 py-2 border rounded rounded-lg border-black border-[0.37px] text-sm placeholder:text-black focus:outline-none focus:ring-2 focus:ring-custom-light-yellow'
    "
    [labelClass]="'font-medium text-sm mb-1'"
    (valueChange)="handleValueChange($event, 'contact')"
  ></app-dynamic-input>
</app-content-filter>

<app-content-table
  [title]="'User List'"
  [label]="'Add New User'"
  [hasButton]="true"
  (buttonClick)="handleButtonClick({ key: 'add' })"
>
  <app-dynamic-table
    [headers]="headers"
    [rows]="data"
    [totalPages]="totalPages"
    [pageSize]="pageSize"
    [currentPage]="pageNo + 1"
    (buttonPagination)="onPageChange($event)"
    (buttonClick)="handleButtonClick($event)"
  >
  </app-dynamic-table>
</app-content-table>
