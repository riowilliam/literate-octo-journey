<app-content-chart>
  <div class="flex gap-4 h-[70px]">
    <div
      class="flex md:flex-row flex-col md:items-center items-start justify-between mb-2"
    >
      <div class="flex gap-2 md:flex-nowrap flex-wrap">
        <span
          class="text-sm cursor-pointer p-2 rounded-md"
          [ngClass]="{
            'bg-custom-yellow': selectedTimeRange === 'All',
            'hover:bg-custom-light-yellow': selectedTimeRange !== 'All'
          }"
          (click)="changeTimeRange('All')"
          >All Time</span
        >
        <span
          class="text-sm cursor-pointer p-2 rounded-md"
          [ngClass]="{
            'bg-custom-yellow': selectedTimeRange === 'Yearly',
            'hover:bg-custom-light-yellow': selectedTimeRange !== 'Yearly'
          }"
          (click)="changeTimeRange('Yearly')"
          >Yearly</span
        >
      </div>
    </div>
    <ng-container [ngSwitch]="selectedTimeRange">
      <ng-container *ngSwitchCase="'Yearly'">
        <div class="flex flex-col gap-4">
          <div class="w-full flex items-center">
            <span class="text-[40px] font-semibold">In</span>
            <div class="mx-2.5">
              <div class="relative inline-block w-full">
                <select
                  [(ngModel)]="selectedYear"
                  class="leading-[3rem] text-[40px] font-semibold pr-14 appearance-none form-select border border-[#A4A4A4] rounded-xl px-3 py-2 placeholder:text-black focus:outline-none focus:ring-2 focus:ring-custom-light-yellow"
                  (change)="onSelectionYearlyChange()"
                >
                  <option [value]="null" disabled selected hidden>Year</option>
                  <option *ngFor="let year of years" [value]="year">
                    {{ year }}
                  </option>
                </select>
                <div
                  class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-700"
                >
                  <svg
                    width="35"
                    height="21"
                    viewBox="0 0 35 21"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M-0.000184845 1.01761L17.5337 20.9999L34.9998 0.982161L-0.000184845 1.01761Z"
                      fill="black"
                    />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </div>
  <div #chartContainer style="width: 100%; height: 400px"></div>
</app-content-chart>
<app-content-card>
  <div class="flex gap-4" *ngFor="let card of cards">
    <app-dynamic-card
      [headerText]="card.headerText"
      [sections]="card.sections"
      [headerClass]="'h-[38px]'"
      [headerTextClass]="'text-xs'"
      [cardClass]="'w-[220px] h-[208px]'"
    >
    </app-dynamic-card>
  </div>
</app-content-card>
