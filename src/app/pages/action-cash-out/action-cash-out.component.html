<app-content-form
  [title]="'Cash Out Mutation'"
  [hasValue]="true"
  [value]="totalAmount"
  [hasId]="name ? true : false"

  [isRequestInvalid]="isRequestInvalid"
  (submitForm)="onSubmit()"
>
  <app-dynamic-form
    [formGroup]="formGroup"
    [fields]="fields"
  ></app-dynamic-form>
</app-content-form>
